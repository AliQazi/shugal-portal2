openapi: 3.0.3
info:
  title: Abid Air Partner API
  version: 1.0.0
  description: Access-controlled API for shared group inventory and partner bookings.
servers:
  - url: https://abidairtravels.com/api/external/v1
security:
  - bearerAuth: []
paths:
  /group-ticketing:
    get:
      summary: List available public group inventory
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: groupType, schema: { type: string } }
        - { in: query, name: airline, schema: { type: string } }
      responses:
        '200': { description: Paginated inventory }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /group-ticketing/{groupId}:
    get:
      summary: Get current group inventory
      parameters:
        - { in: path, name: groupId, required: true, schema: { type: string } }
      responses:
        '200': { description: Group inventory }
        '404': { description: Group is unavailable or not found }
  /umrah-packages:
    get:
      summary: List available public Umrah packages
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: source, schema: { type: string, enum: [local-db, travel-network] } }
      responses:
        '200': { description: Paginated Umrah package inventory }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /umrah-packages/{packageId}:
    get:
      summary: Get current Umrah package inventory
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string } }
      responses:
        '200': { description: Umrah package inventory }
        '404': { description: Package is unavailable or not found }
  /bookings:
    get:
      summary: List bookings belonging to the authenticated API client
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated client-owned bookings }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create an on-hold booking and reserve shared inventory
      parameters:
        - { in: header, name: X-Availability-Token, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBooking' }
      responses:
        '201': { description: Booking created }
        '409': { description: Insufficient inventory }
        '422': { description: Invalid payload }
        '428': { description: Availability check required or expired }
  /availability:
    post:
      summary: Check inventory for the requested passenger counts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryId]
              properties:
                inventoryId: { type: string }
                adults: { type: integer, minimum: 0, default: 0 }
                children: { type: integer, minimum: 0, default: 0 }
                infants: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Availability result and short-lived token when available }
        '404': { description: Inventory unavailable or not found }
  /bookings/{bookingId}:
    get:
      summary: Get a booking belonging to the authenticated API client
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string } }
      responses:
        '200': { description: Booking }
        '404': { description: Booking not found }
  /bookings/{bookingId}/cancel:
    post:
      summary: Cancel an on-hold booking and release its reserved seats
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string } }
      responses:
        '200': { description: Booking cancelled }
        '409': { description: Booking can no longer be cancelled through the API }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: API-Key }
  responses:
    Unauthorized: { description: API key is missing, invalid, or revoked }
  schemas:
    CreateBooking:
      type: object
      required: [inventoryId, contactPersonName, passengers]
      properties:
        inventoryId: { type: string, example: 65fd12ab34cd56ef7890abcd }
        roomType: { type: string, enum: [sharing, quad, triple, double], description: Required when inventoryId identifies an Umrah package }
        contactPersonName: { type: string, example: Muhammad Ali }
        passengers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Passenger' }
    Passenger:
      type: object
      required: [type, title, givenName, surName, passport, nationality]
      properties:
        type: { type: string, enum: [Adult, Child, Infant] }
        title: { type: string, example: MR }
        givenName: { type: string }
        surName: { type: string }
        passport: { type: string }
        dateOfBirth: { type: string, format: date }
        passportIssue: { type: string, format: date }
        passportExpiry: { type: string, format: date }
        nationality: { type: string, example: Pakistan }
